rules:
  - id: custom-csharp-insecure-crypto-password
    languages:
      - csharp
    severity: ERROR
    message: >-
      A weak hash algorithm (MD5 or SHA1) is used on likely password data.
      Use a dedicated password hashing scheme (e.g. PBKDF2 / Rfc2898DeriveBytes,
      BCrypt, or Argon2) with a per-user salt. SHA256 alone is not suitable
      for password storage.
    pattern-either:
      - patterns:
          - pattern-inside: |
              using (MD5 $H = MD5.Create())
              { ... }
          - pattern: $H.ComputeHash($DATA)
          - metavariable-regex:
              metavariable: $DATA
              regex: (?i).*password.*
      - patterns:
          - pattern-inside: |
              using (SHA1 $H = SHA1.Create())
              { ... }
          - pattern: $H.ComputeHash($DATA)
          - metavariable-regex:
              metavariable: $DATA
              regex: (?i).*password.*
      - patterns:
          - pattern-inside: |
              using (MD5 $H = MD5.Create())
              { ... }
          - pattern: $H.ComputeHash($DATA)
          - metavariable-regex:
              metavariable: $DATA
              regex: (?i).*pin.*
      - patterns:
          - pattern-inside: |
              using (SHA1 $H = SHA1.Create())
              { ... }
          - pattern: $H.ComputeHash($DATA)
          - metavariable-regex:
              metavariable: $DATA
              regex: (?i).*pin.*

  - id: custom-csharp-hardcoded-secret
    languages:
      - csharp
    severity: ERROR
    message: >-
      A hardcoded secret or credential string literal is used. Move secrets
      to environment variables / secret store and inject via configuration.
    patterns:
      - pattern-either:
          - pattern: |
              var $X = "$SECRET";
          - pattern: |
              string $X = "$SECRET";
          - pattern: |
              const string $X = "$SECRET";
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(api[_-]?key|secret|password|passwd|token|credential).*
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*[a-z0-9]{16,}.*
      - pattern-not-regex: (?is).*(sp_|SELECT |INSERT |UPDATE |DELETE FROM|CREATE |ALTER ).*